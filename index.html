<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tanışma</title>

  <!-- MapLibre GL 3D CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Minimalist Giriş Ekranı -->
  <div id="auth-overlay">
    <div class="auth-box">
      <div class="auth-tag">Çakıl</div>
      <div class="auth-question">KİM OLDUĞUNU BİLİRSİN SEN</div>
      
      <form id="auth-form" onsubmit="checkAuth(event)">
        <div class="input-line">
          <span class="prompt-sign">></span>
          <input 
            type="text" 
            id="auth-input" 
            autocomplete="off" 
            autocapitalize="none" 
            spellcheck="false" 
            placeholder="cevap..." 
            required 
          />
        </div>
        <button type="submit" class="submit-btn">[ GİRİŞ ]</button>
      </form>
      
      <div id="auth-error" class="auth-error"></div>
    </div>
  </div>

  <!-- 3D Harita Alanı -->
  <div id="map"></div>

  <!-- Üst Bilgi ve Patikaya Oturt Kartı -->
  <div class="info-card">
    <h3>Çakıl</h3>
    <p id="status"></p>
    <div id="guide-info"></div>
    <button id="locate-btn" onclick="locateAndSnapToTrail()">Beni Patikaya Oturt</button>
  </div>

  <!-- MapLibre GL 3D Kütüphanesi -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
