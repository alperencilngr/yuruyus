<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tanışma Yürüyüşü</title>

  <!-- MapLibre GL 3D CSS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Şifre Ekranı -->
  <div id="auth-overlay">
    <div class="auth-box">
      <h2>Giriş Yap</h2>
      <p>Devam etmek için parolayı girin:</p>
      <form onsubmit="checkAuth(event)">
        <input type="password" id="auth-input" placeholder="Parola..." autofocus required />
        <button type="submit">Giriş</button>
      </form>
      <div id="auth-error"></div>
    </div>
  </div>

  <!-- 3D Harita -->
  <div id="map"></div>

  <!-- Üst Bilgi Kartı -->
  <div class="info-card">
    <h3>Yürüyüş</h3>
    <p id="status">Yükleniyor...</p>
    <div id="guide-info"></div>
    <button id="locate-btn" onclick="locateAndSnapToTrail()">Beni Patikaya Oturt</button>
  </div>

  <script>
    function checkAuth(event) {
      event.preventDefault();
      const inputEl = document.getElementById('auth-input');
      const errorEl = document.getElementById('auth-error');
      const val = inputEl.value.trim().toLowerCase();

      if (val === 'malcom') {
        const overlay = document.getElementById('auth-overlay');
        if (overlay) overlay.style.display = 'none';
      } else {
        errorEl.innerText = 'Hatalı parola!';
        inputEl.value = '';
        inputEl.focus();
      }
    }
  </script>

  <!-- MapLibre GL -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
